<!-- The social card for a build page. Rendered to builds/<slug>/og.png at
     1200x630 by:
       node scripts/portfolio/build-og-builds.mjs
     Filled from builds/<slug>/og.json. Light, to match the build pages; the
     main portfolio card stays dark to match its own theme. Carries a call to
     action on the image itself, because link inspectors (and people) look for
     one. -->
<style>
  :root {
    --ground: #EEF3F1;
    --ground-2: #FFFFFF;
    --rule: #CCDAD7;
    --ink: #0E2426;
    --ink-2: #34504E;
    --muted: #4A6361;
    --teal: #0A6A62;
    --teal-fill: #0F766E;
    --signal: #FFCC1A;
    --blocks: linear-gradient(110deg,
      #0F766E 0%, #0F766E 28%, #FFCC1A 28%, #FFCC1A 48%,
      #0B4F4A 48%, #0B4F4A 68%, #6D3FD1 68%, #6D3FD1 88%, #0F766E 88%);
    --display: "Helvetica Neue", "Arial Narrow", Inter, system-ui, sans-serif;
    --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "SF Mono", "JetBrains Mono", Menlo, ui-monospace, monospace;
  }
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--ground); -webkit-font-smoothing: antialiased; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box;
    padding: 60px 72px 56px; display: grid;
    grid-template-columns: minmax(0, 1fr) 420px; gap: 56px;
    background: var(--ground); color: var(--ink);
  }
  .band { height: 14px; background: var(--blocks); margin-bottom: 40px; }
  .left { display: flex; flex-direction: column; min-width: 0; }
  .id { display: flex; gap: 22px; align-items: baseline; margin-bottom: 24px; }
  .id b { font: 600 18px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
  .id span { font: 500 15px/1 var(--mono); letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
  h1 {
    font-family: var(--display); font-weight: 800; text-transform: uppercase;
    letter-spacing: -.04em; line-height: .88; font-size: 104px; margin: 0; color: var(--ink);
  }
  .sub { font: 400 24px/1.4 var(--body); color: var(--ink-2); margin: 22px 0 0; }
  .cta {
    align-self: flex-start; margin-top: 26px;
    display: inline-flex; align-items: center; gap: 14px;
    background: var(--ink); color: #FFFFFF;
    font: 600 17px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
    padding: 16px 20px;
  }
  .cta i { font-style: normal; color: var(--signal); font-size: 22px; line-height: 1; }
  .foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; font: 500 14.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .foot b { color: var(--teal); font-weight: 600; }
  .right { display: flex; flex-direction: column; justify-content: center; }
  .plate { border: 1px solid var(--rule); background: var(--ground-2); padding: 14px; }
  .plate img { display: block; width: 390px; height: 390px; object-fit: cover; object-position: {{POS}}; }
  .status { display: flex; align-items: center; gap: 10px; margin-top: 14px; font: 500 14px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .status::before { content: ""; width: 12px; height: 12px; background: {{STATUS_COLOR}}; outline: 1px solid var(--ink); }
</style>
<div class="card">
  <div class="left">
    <div class="band"></div>
    <div class="id"><b>Colin Calnan</b><span>{{KICKER}}</span></div>
    <h1>{{TITLE}}</h1>
    <p class="sub">{{SUB}}</p>
    <div class="cta">{{CTA}} <i>&rarr;</i></div>
    <div class="foot">
      <span>{{STACK}}</span>
      <span><b>{{METHOD_MARK}}</b>{{METHOD_REST}} &middot; colincalnan.github.io</span>
    </div>
  </div>
  <div class="right">
    <div class="plate"><img src="{{IMAGE}}" alt=""></div>
    <div class="status">{{STATUS}}</div>
  </div>
</div>
